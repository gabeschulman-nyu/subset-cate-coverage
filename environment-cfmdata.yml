# Environment for fetching the OpenML base tables of the CFM-scale prior
# (benchmarks/get_openml_tables.sh -> experiments/cfm/openml_tables.py). Exact versions used.
name: cfmdata
channels:
  - defaults
dependencies:
  - python=3.10.21
  - pip
  - pip:
      - certifi==2026.7.22
      - charset-normalizer==3.5.1
      - idna==3.20
      - numpy==2.1.3
      - packaging==26.3
      - pandas==2.2.3
      - pyarrow==17.0.0
      - python-dateutil==2.9.0.post0
      - pytz==2026.4
      - requests==2.32.3
      - six==1.17.0
      - tzdata==2026.4
      - urllib3==2.8.0
