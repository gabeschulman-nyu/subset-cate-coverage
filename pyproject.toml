[project]
name = "subsetcate"
version = "1.0.0"
description = "Code for 'Unit-level aggregation breaks coverage in causal foundation models'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Anonymous" }]
# Ranges here; environment.yml pins the exact versions behind the results.
dependencies = [
    "cloudpickle>=3.1.2",
    "dowhy>=0.14.0",
    "econml>=0.16.0",
    "filelock>=3.0.0",
    "graphviz>=0.20.0",
    "joblib>=1.2.0",
    "matplotlib>=3.7.1",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=9.0.0",
    "pytorch-lightning>=2.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.1",
    "seaborn>=0.12.2",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
]

[project.scripts]
run-experiment = "subsetcate.run_experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subsetcate"]
